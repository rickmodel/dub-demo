# ═══════════════════════════════════════════════════════════════
# Qoder CI/CD Pipeline — dub-demo
# 
# 安全架构:
#   - 安全无关步骤 → GitHub 云端 Runner (ubuntu-latest)
#   - QoderCLI 步骤 → Self-hosted Runner (API Key 仅存本地)
#
# 三大核心能力:
#   1. PR 触发 → QoderCLI 自动 Code Review + 自动修复
#   2. Issue 标记 qoder-autofix → QoderCLI 自动修复并创建 PR
#   3. main 推送 → 构建 Docker → 部署阿里云 ECS
# ═══════════════════════════════════════════════════════════════

name: "Qoder CI/CD Pipeline"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  issues:
    types: [opened, labeled]

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: 代码质量检查
  # 运行环境: GitHub 云端 (无敏感信息)
  # ─────────────────────────────────────────────────────────────
  quality-check:
    name: "🔨 代码质量检查"
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install

      - name: Prettier 格式检查
        run: pnpm run prettier-check
        continue-on-error: true

      - name: ESLint 检查
        run: pnpm lint
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # Stage 2: QoderCLI AI Code Review (仅 PR)
  # 运行环境: Self-hosted Runner (API Key 本地存储)
  # 
  # 安全说明:
  #   QODER_API_KEY 通过 Runner 所在机器的环境变量提供
  #   不经过 GitHub Secrets，不在云端暴露
  # ─────────────────────────────────────────────────────────────
  qoder-review:
    name: "🤖 QoderCLI Code Review"
    if: github.event_name == 'pull_request'
    needs: quality-check
    runs-on: [self-hosted, qoder]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 验证 QoderCLI 环境
        run: |
          # 检查 QoderCLI 是否已安装在 Runner 机器上
          if ! command -v qoder &> /dev/null; then
            echo "❌ QoderCLI 未安装，请在 Runner 机器上执行:"
            echo "   npm install -g @anthropic-ai/qoder-cli"
            exit 1
          fi
          
          # 检查 API Key 环境变量（值不会打印到日志）
          if [ -z "$QODER_API_KEY" ]; then
            echo "❌ QODER_API_KEY 环境变量未设置"
            echo "   请在 Runner 机器上配置 ~/.bashrc 或 /etc/environment:"
            echo "   export QODER_API_KEY=your-key-here"
            exit 1
          fi
          
          echo "✅ QoderCLI 环境就绪"
          qoder --version 2>/dev/null || echo "QoderCLI 版本检查跳过"

      - name: AI Code Review
        run: |
          echo "🔍 开始 AI Code Review (Self-hosted Runner)"
          
          qoder --headless \
            --message "Review this PR diff. Project: Dub (Next.js link management platform).
              Focus on:
              1. Logic errors and potential bugs
              2. Security vulnerabilities (API routes, Prisma queries)
              3. TypeScript type safety (no 'any' allowed)
              4. Performance issues (N+1 queries)
              5. Test coverage for new code
              
              For each issue found, output:
              - Severity: critical/warning/info
              - File and line number
              - Description and suggested fix
              
              Post findings as GitHub PR review comments." \
            --allowedTools "Bash,Read,Glob,Grep"
        # QODER_API_KEY 从 Runner 机器的环境变量自动继承
        # 不需要 env: 块声明

      - name: 自动修复 Lint (质量检查失败时)
        if: failure()
        run: |
          qoder --headless \
            --message "Fix lint and type errors in this PR.
              1. Run 'pnpm lint --fix' to auto-fix ESLint issues
              2. Run 'pnpm run format' to fix Prettier issues
              3. Commit fixes with: fix: auto-fix lint issues by QoderCLI
              4. Push the commit" \
            --allowedTools "Bash,Read,Edit"

  # ─────────────────────────────────────────────────────────────
  # Stage 3: QoderCLI Issue 自动修复
  # 运行环境: Self-hosted Runner (API Key 本地存储)
  #   给 Issue 打上 "qoder-autofix" label 即触发
  # ─────────────────────────────────────────────────────────────
  qoder-issue-fix:
    name: "🔧 QoderCLI Issue 自动修复"
    if: >
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'qoder-autofix')
    runs-on: [self-hosted, qoder]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js 环境
        run: |
          # Self-hosted Runner 需要确保 Node.js 和 pnpm 可用
          node --version || echo "请安装 Node.js $NODE_VERSION"
          pnpm --version || echo "请安装 pnpm"

      - name: 安装依赖
        run: pnpm install

      - name: 创建修复分支
        run: |
          BRANCH="qoder/fix-issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "📌 Created branch: $BRANCH"

      - name: QoderCLI 自动修复
        run: |
          echo "🤖 修复 Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          
          qoder --headless \
            --message "Fix GitHub Issue #${{ github.event.issue.number }}.
              Title: ${{ github.event.issue.title }}
              Body: ${{ github.event.issue.body }}
              
              Instructions:
              1. Analyze the issue and locate relevant code
              2. Implement the fix following .qoder/AGENTS.md conventions
              3. Add or update tests for the fix
              4. Run 'pnpm lint' and 'pnpm test' to verify
              5. Commit changes with: fix: <description> (#${{ github.event.issue.number }})
              6. Do NOT modify database schema without approval" \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: 推送并创建 PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ] || [ "$(git log origin/main..HEAD --oneline | wc -l)" -gt 0 ]; then
            git push origin "$BRANCH"
            gh pr create \
              --title "fix: Auto-fix for #${{ github.event.issue.number }}" \
              --body "## 🤖 QoderCLI 自动修复

          Closes #${{ github.event.issue.number }}

          此 PR 由 QoderCLI 在 **Self-hosted Runner** 上自动生成，API Key 未经过云端。
          请人工审核后合并。

          ### 修复说明
          - **Issue**: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}
          - **方式**: QoderCLI Headless 自动分析和修复
          - **执行环境**: Self-hosted Runner (API Key 本地存储)
          - **审核重点**: 逻辑正确性、边界情况、测试覆盖" \
              --base main \
              --head "$BRANCH" \
              --label "qoder-generated"
            echo "✅ PR 已创建"
          else
            echo "⚠️ 没有检测到代码变更，跳过 PR 创建"
          fi

  # ─────────────────────────────────────────────────────────────
  # Stage 4: Docker 构建 (仅 main push)
  # 运行环境: GitHub 云端 (无敏感信息)
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker 构建"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成镜像标签
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          TAG="${{ github.run_number }}-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Image tag: $TAG"

      - name: 构建 Docker 镜像
        run: |
          echo "🐳 构建 Docker 镜像: dub-demo:${{ steps.meta.outputs.tag }}"
          # 实际构建:
          # docker build -t dub-demo:${{ steps.meta.outputs.tag }} -f deploy/Dockerfile .
          # docker login registry.cn-hangzhou.aliyuncs.com
          # docker push registry.cn-hangzhou.aliyuncs.com/$NS/dub:$TAG
          echo "✅ Docker 构建步骤就绪"

  # ─────────────────────────────────────────────────────────────
  # Stage 5: Release Notes (仅 main push)
  # 运行环境: Self-hosted Runner (使用 QoderCLI)
  # ─────────────────────────────────────────────────────────────
  release-notes:
    name: "📝 Release Notes"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality-check
    runs-on: [self-hosted, qoder]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: QoderCLI 生成 Release Notes
        run: |
          qoder --headless \
            --message "Generate release notes in Chinese for the latest changes merged to main.
              Analyze git log since the last tag.
              Format:
              ## 🚀 版本 vX.Y.Z
              ### 新功能
              - ...
              ### Bug 修复
              - ...
              ### 其他改进
              - ...
              
              Output to RELEASE_NOTES.md" \
            --allowedTools "Bash,Read,Write"
