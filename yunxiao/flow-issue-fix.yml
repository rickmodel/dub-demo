# ═══════════════════════════════════════════════════════════════
# 云效 Flow — 缺陷自动修复 (最小可运行版)
#
# 这是 Demo 的核心流水线，展示 QoderCLI 从分析→修复→MR 的完整能力
#
# 触发: Projex 工作项 Webhook / 手动运行
# 效果: 5分钟内完成缺陷分析、代码修复、测试验证、MR创建
# ═══════════════════════════════════════════════════════════════

sources:
  dub_repo:
    type: codeup
    name: dub-demo
    endpoint: https://codeup.aliyun.com/${ORG_ID}/dub/dub-demo
    branch: main

params:
  WORK_ITEM_ID:
    description: "Projex 工作项 ID"
    required: true
  WORK_ITEM_TITLE:
    description: "工作项标题"
    required: true
  WORK_ITEM_DESCRIPTION:
    description: "工作项详细描述 (越详细修复越精准)"
    required: false
    default: ""
  WORK_ITEM_TYPE:
    description: "类型: bug / requirement / task"
    required: false
    default: "bug"

stages:

  fix_stage:
    name: "QoderCLI 自动修复"
    jobs:
      fix_job:
        name: "分析 → 修复 → 验证 → 创建MR"
        runsOn:
          group: China Aliyun Linux 3
        timeoutMinutes: 20
        steps:
          checkout_step:
            step: Checkout
            name: "拉取代码"
            with:
              fetchDepth: 0

          setup_step:
            step: Command
            name: "环境准备 (Node.js + pnpm + QoderCLI)"
            with:
              run: |
                curl -fsSL https://fnm.vercel.app/install | bash
                eval "$(fnm env)"
                fnm install 20 && fnm use 20
                npm install -g pnpm@9 @anthropic-ai/qoder-cli
                pnpm install
                echo "✅ 环境就绪: Node $(node -v), QoderCLI $(qoder --version 2>/dev/null || echo 'installed')"
            envs:
              QODER_API_KEY: "${QODER_API_KEY}"

          branch_step:
            step: Command
            name: "创建修复分支"
            with:
              run: |
                PREFIX=$( [ "${WORK_ITEM_TYPE}" = "bug" ] && echo "fix" || echo "feat" )
                BRANCH="${PREFIX}/projex-${WORK_ITEM_ID}"
                git checkout -b "${BRANCH}"
                echo "BRANCH=${BRANCH}" >> ${PIPELINE_ENV}
                echo "📌 分支: ${BRANCH}"

          fix_step:
            step: Command
            name: "🤖 QoderCLI 自动修复"
            with:
              run: |
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "🤖 QoderCLI 开始修复 Projex#${WORK_ITEM_ID}"
                echo "   ${WORK_ITEM_TITLE}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                qoder --headless \
                  --message "修复 Projex 工作项 #${WORK_ITEM_ID}。

                    【类型】${WORK_ITEM_TYPE}
                    【标题】${WORK_ITEM_TITLE}
                    【描述】${WORK_ITEM_DESCRIPTION}

                    执行步骤:
                    1. 分析工作项，通过 Grep/Glob 定位相关代码
                    2. 按 .qoder/AGENTS.md 编码规范实现修复
                    3. 添加测试用例验证修复
                    4. pnpm lint + pnpm test 确保通过
                    5. git add + git commit -m '${WORK_ITEM_TYPE}: ${WORK_ITEM_TITLE} (Projex#${WORK_ITEM_ID})'

                    自治边界:
                    ✅ 可以修改业务逻辑、添加校验、补充测试
                    ⚠️ 不可修改 Prisma Schema / 认证代码 / 支付代码
                    🚫 不可删除文件 / 修改CI配置" \
                  --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
              timeout: 600
            envs:
              QODER_API_KEY: "${QODER_API_KEY}"

          push_step:
            step: Command
            name: "推送 + 创建 MR"
            with:
              run: |
                if [ -n "$(git status --porcelain)" ] || [ "$(git log origin/main..HEAD --oneline | wc -l)" -gt 0 ]; then
                  git push origin "${BRANCH}"

                  # Codeup API 创建 MR
                  curl -s -X POST \
                    "https://codeup.aliyun.com/api/v4/projects/${CODEUP_PROJECT_ID}/merge_requests" \
                    -H "Content-Type: application/json" \
                    -H "Private-Token: ${CODEUP_TOKEN}" \
                    -d "{\"title\":\"${WORK_ITEM_TYPE}: ${WORK_ITEM_TITLE} (Projex#${WORK_ITEM_ID})\",\"source_branch\":\"${BRANCH}\",\"target_branch\":\"main\",\"description\":\"🤖 QoderCLI 自动修复\\n\\n关联: Projex#${WORK_ITEM_ID}\\n环境: 云效 Flow (阿里云内网)\\n\\n请审核后合并。\"}"

                  echo "✅ MR 已创建"
                else
                  echo "⚠️ 无代码变更，跳过 MR"
                fi
            envs:
              CODEUP_TOKEN: "${CODEUP_TOKEN}"
              CODEUP_PROJECT_ID: "${CODEUP_PROJECT_ID}"

          notify_step:
            step: DingTalkNotice
            name: "钉钉通知修复完成"
            with:
              webhook: "${DINGTALK_WEBHOOK}"
              msgtype: markdown
              title: "Projex#${WORK_ITEM_ID} 修复完成"
              text: |
                ## 🔧 自动修复完成

                **工作项**: Projex#${WORK_ITEM_ID}
                **标题**: ${WORK_ITEM_TITLE}
                **分支**: ${BRANCH}

                MR 已创建，请前往 Codeup 审核合并。
