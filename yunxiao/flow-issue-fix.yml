# ═══════════════════════════════════════════════════════════════
# 云效 Flow 流水线 3/3 — 缺陷/需求 自动修复
#
# 触发条件:
#   - 云效 Projex 工作项状态变更 Webhook (标记为"待自动修复")
#   - 手动运行（填写工作项参数）
#
# 功能: QoderCLI 分析需求/缺陷 → 自动实现/修复 → 创建 MR → 钉钉通知
#
# 安全架构:
#   - 代码: Codeup (阿里云)
#   - API Key: 云效变量管理 (加密)
#   - 执行: China Aliyun Linux 3 (阿里云内网)
#   - 全链路阿里云内网闭环
#
# 配置方式:
#   1. 云效 Flow → 新建流水线 → YAML 模式
#   2. 关联 Codeup 代码库
#   3. 触发方式:
#      方式 A: 开启 Webhook 触发 → 复制 URL → 配置到 Projex 自动化规则
#      方式 B: 手动运行，填写工作项参数
#   4. 变量管理配置 QODER_API_KEY + CODEUP_TOKEN (加密)
# ═══════════════════════════════════════════════════════════════

sources:
  dub_repo:
    type: codeup
    name: dub-demo
    endpoint: https://codeup.aliyun.com/${ORG_ID}/dub/dub-demo
    branch: main

# 手动运行参数 (Webhook 触发时由 payload 注入)
params:
  WORK_ITEM_ID:
    description: "云效 Projex 工作项 ID"
    required: true
  WORK_ITEM_TITLE:
    description: "工作项标题"
    required: true
  WORK_ITEM_DESCRIPTION:
    description: "工作项详细描述"
    required: false
    default: ""
  WORK_ITEM_TYPE:
    description: "类型: bug / requirement / task"
    required: false
    default: "bug"

stages:

  # ─── 阶段 1: 代码环境准备 ────────────────────────────────
  prepare_stage:
    name: "环境准备"
    jobs:
      prepare_job:
        name: "拉取代码 + 创建修复分支"
        runsOn:
          group: China Aliyun Linux 3
        timeoutMinutes: 25
        steps:
          checkout_step:
            step: Checkout
            name: "拉取代码（完整历史）"
            with:
              fetchDepth: 0

          node_setup:
            step: NpmBuild
            name: "安装 Node.js 20 + pnpm 9 + 依赖"
            with:
              nodeVersion: "20"
              run: |
                npm install -g pnpm@9
                pnpm install

          branch_step:
            step: Command
            name: "创建修复分支"
            with:
              run: |
                # 根据工作项类型生成分支名
                TYPE="${WORK_ITEM_TYPE}"
                if [ "$TYPE" = "bug" ]; then
                  PREFIX="fix"
                elif [ "$TYPE" = "requirement" ]; then
                  PREFIX="feat"
                else
                  PREFIX="chore"
                fi

                BRANCH="${PREFIX}/projex-${WORK_ITEM_ID}"
                git checkout -b "${BRANCH}"
                echo "BRANCH=${BRANCH}" >> ${PIPELINE_ENV}
                echo "📌 创建分支: ${BRANCH}"

  # ─── 阶段 2: QoderCLI 自动修复 ──────────────────────────
  fix_stage:
    name: "自动修复"
    jobs:
      fix_job:
        name: "QoderCLI 分析并修复"
        needs: [prepare_job]
        runsOn:
          group: China Aliyun Linux 3
        timeoutMinutes: 20
        steps:
          qodercli_fix:
            step: Command
            name: "QoderCLI Headless 自动修复"
            with:
              run: |
                # 安装 QoderCLI
                curl -fsSL https://fnm.vercel.app/install | bash
                eval "$(fnm env)"
                fnm install 20 && fnm use 20
                npm install -g @anthropic-ai/qoder-cli

                echo "🤖 修复 Projex 工作项 #${WORK_ITEM_ID}: ${WORK_ITEM_TITLE}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                qoder --headless \
                  --message "修复云效 Projex 工作项 #${WORK_ITEM_ID}。

                    类型: ${WORK_ITEM_TYPE}
                    标题: ${WORK_ITEM_TITLE}
                    描述: ${WORK_ITEM_DESCRIPTION}

                    执行步骤:
                    1. 分析工作项描述，理解需求或 Bug 现象
                    2. 通过代码搜索定位相关文件
                    3. 按照 .qoder/AGENTS.md 的编码规范实现修复/开发
                    4. 为变更添加或更新测试用例
                    5. 运行 pnpm lint 和 pnpm test 验证
                    6. 提交代码: ${WORK_ITEM_TYPE}: <描述> (Projex#${WORK_ITEM_ID})

                    自治边界 (不可逾越):
                    - 禁止修改 Prisma Schema (需人工审核)
                    - 禁止修改认证/支付/安全相关代码
                    - 禁止删除文件或目录
                    - 禁止修改 CI/CD 配置" \
                  --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
              timeout: 900
            envs:
              QODER_API_KEY: "${QODER_API_KEY}"

  # ─── 阶段 3: 推送分支 + 创建 MR ─────────────────────────
  mr_stage:
    name: "创建 Merge Request"
    jobs:
      mr_job:
        name: "推送分支并创建 MR"
        needs: [fix_job]
        runsOn:
          group: China Aliyun Linux 3
        steps:
          push_mr_step:
            step: Command
            name: "推送并创建 Codeup MR"
            with:
              run: |
                # 检查是否有代码变更
                if [ -z "$(git status --porcelain)" ] && \
                   [ "$(git log origin/main..HEAD --oneline | wc -l)" -eq 0 ]; then
                  echo "⚠️ 没有检测到代码变更，跳过 MR 创建"
                  exit 0
                fi

                # 推送修复分支到 Codeup
                git push origin "${BRANCH}"

                # 通过 Codeup Open API 创建 MR
                # https://help.aliyun.com/document_detail/2740803.html
                MR_TITLE="${WORK_ITEM_TYPE}: Auto-fix for Projex#${WORK_ITEM_ID} — ${WORK_ITEM_TITLE}"
                MR_BODY="## 🤖 QoderCLI 自动修复\n\n关联 Projex 工作项: #${WORK_ITEM_ID}\n\n此 MR 由 QoderCLI 在云效 Flow 流水线中自动生成。\nAPI Key 存储在云效加密变量中，全程阿里云内网执行。\n\n### 修复说明\n- **工作项**: #${WORK_ITEM_ID} — ${WORK_ITEM_TITLE}\n- **类型**: ${WORK_ITEM_TYPE}\n- **执行环境**: 云效 Flow (China Aliyun Linux 3)\n- **审核重点**: 逻辑正确性、边界情况、测试覆盖"

                # 使用 curl 调用 Codeup API 创建 MR
                curl -s -X POST \
                  "https://codeup.aliyun.com/api/v4/projects/${CODEUP_PROJECT_ID}/merge_requests" \
                  -H "Content-Type: application/json" \
                  -H "Private-Token: ${CODEUP_TOKEN}" \
                  -d "{
                    \"title\": \"${MR_TITLE}\",
                    \"description\": \"${MR_BODY}\",
                    \"source_branch\": \"${BRANCH}\",
                    \"target_branch\": \"main\"
                  }" | tee /tmp/mr-response.json

                echo ""
                echo "✅ Merge Request 已创建"
            envs:
              CODEUP_TOKEN: "${CODEUP_TOKEN}"
              CODEUP_PROJECT_ID: "${CODEUP_PROJECT_ID}"
              BRANCH: "${BRANCH}"

  # ─── 阶段 4: 钉钉通知 ───────────────────────────────────
  notify_stage:
    name: "修复完成通知"
    jobs:
      notify_job:
        name: "钉钉通知审核人"
        needs: [mr_job]
        runsOn:
          group: China Aliyun Linux 3
        steps:
          dingtalk_step:
            step: DingTalkNotice
            name: "通知审核人"
            with:
              webhook: "${DINGTALK_WEBHOOK}"
              msgtype: markdown
              title: "Projex#${WORK_ITEM_ID} 自动修复完成"
              text: |
                ## 🔧 工作项自动修复完成

                **工作项**: #${WORK_ITEM_ID} — ${WORK_ITEM_TITLE}
                **类型**: ${WORK_ITEM_TYPE}
                **修复分支**: ${BRANCH}
                **执行环境**: 云效 Flow (阿里云内网)

                MR 已自动创建，请前往 Codeup 审核并合并。

                ---
                *由 QoderCLI + 云效 Flow 自动化修复*
