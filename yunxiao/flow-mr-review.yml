# ═══════════════════════════════════════════════════════════════
# 云效 Flow 流水线 2/3 — MR AI Code Review
#
# 触发条件: Codeup Merge Request 新建或更新
# 功能: 代码质量检查 → QoderCLI AI Code Review → 自动修复 Lint
#       → 审查报告作为 MR 评论回写
#
# 安全架构:
#   - 代码: Codeup (阿里云)
#   - API Key: 云效变量管理 (加密)
#   - 执行: China Aliyun Linux 3 (阿里云内网)
#
# 配置方式:
#   1. 云效 Flow → 新建流水线 → YAML 模式
#   2. 关联 Codeup 代码库
#   3. 开启代码源触发: MR 新建 + MR 更新
#   4. 变量管理配置 QODER_API_KEY (加密)
# ═══════════════════════════════════════════════════════════════

sources:
  dub_repo:
    type: codeup
    name: dub-demo
    endpoint: https://codeup.aliyun.com/${ORG_ID}/dub/dub-demo
    branch: main
    trigger:
      mergeRequest:
        events:
          - open
          - update

stages:

  # ─── 阶段 1: 代码质量检查 ─────────────────────────────────
  quality_stage:
    name: "代码质量检查"
    jobs:
      quality_job:
        name: "Lint + Format"
        runsOn:
          group: China Aliyun Linux 3
        steps:
          checkout_step:
            step: Checkout
            name: "拉取代码（含完整历史）"
            with:
              fetchDepth: 0

          node_setup:
            step: NpmBuild
            name: "安装 Node.js 20 + pnpm 9 + 依赖"
            with:
              nodeVersion: "20"
              run: |
                npm install -g pnpm@9
                pnpm install

          prettier_check:
            step: Command
            name: "Prettier 格式检查"
            with:
              run: pnpm run prettier-check
            continueOnError: true

          lint_check:
            step: Command
            name: "ESLint 代码规范检查"
            with:
              run: pnpm lint
            continueOnError: true

  # ─── 阶段 2: QoderCLI AI Code Review ─────────────────────
  review_stage:
    name: "AI 代码审查"
    jobs:
      review_job:
        name: "QoderCLI Code Review"
        needs: [quality_job]
        runsOn:
          group: China Aliyun Linux 3
        timeoutMinutes: 15
        steps:
          checkout_step:
            step: Checkout
            name: "拉取代码"
            with:
              fetchDepth: 0

          qodercli_review:
            step: Command
            name: "安装 QoderCLI + AI 代码审查"
            with:
              run: |
                # 安装运行环境
                curl -fsSL https://fnm.vercel.app/install | bash
                eval "$(fnm env)"
                fnm install 20 && fnm use 20
                npm install -g @anthropic-ai/qoder-cli

                echo "🔍 开始 AI Code Review — 云效 Flow 安全环境"

                # 获取 MR 变更的基准
                BASE_SHA="${CI_MERGE_REQUEST_TARGET_SHA:-HEAD~1}"

                qoder --headless \
                  --message "审查本次 Merge Request 的代码变更 (对比基准: ${BASE_SHA})。

                    项目: Dub (Next.js 14 全栈链接管理平台)
                    技术栈: TypeScript + Prisma + Tailwind + Turbo monorepo
                    代码托管: 云效 Codeup

                    审查要点:
                    1. 逻辑错误和潜在 Bug
                    2. 安全漏洞（API Routes 认证、Prisma 查询注入）
                    3. 性能问题（N+1 查询、大列表无分页）
                    4. TypeScript 类型安全（禁用 any）
                    5. API 入参是否有 Zod 校验
                    6. 新增代码是否有测试覆盖
                    7. 是否符合 .qoder/AGENTS.md 编码规范

                    对每个问题输出:
                    - 严重级别: critical / warning / info
                    - 文件路径和行号
                    - 问题描述和修复建议

                    以中文输出审查报告到 review-report.md" \
                  --allowedTools "Bash,Read,Glob,Grep,Write"

                # 输出审查报告到流水线日志
                echo "═══════════════════════════════════════"
                echo "         AI Code Review 报告"
                echo "═══════════════════════════════════════"
                cat review-report.md 2>/dev/null || echo "审查报告未生成"
              timeout: 600
            envs:
              QODER_API_KEY: "${QODER_API_KEY}"
            artifacts:
              - name: review-report
                path: review-report.md

  # ─── 阶段 3: 自动修复 Lint ───────────────────────────────
  autofix_stage:
    name: "自动修复"
    jobs:
      autofix_job:
        name: "QoderCLI 自动修复 Lint + Format"
        needs: [review_job]
        runsOn:
          group: China Aliyun Linux 3
        steps:
          checkout_step:
            step: Checkout
            name: "拉取代码（MR 源分支）"

          node_setup:
            step: NpmBuild
            name: "安装 Node.js + pnpm"
            with:
              nodeVersion: "20"
              run: |
                npm install -g pnpm@9
                pnpm install

          autofix_step:
            step: Command
            name: "QoderCLI 自动修复"
            with:
              run: |
                curl -fsSL https://fnm.vercel.app/install | bash
                eval "$(fnm env)"
                fnm install 20 && fnm use 20
                npm install -g @anthropic-ai/qoder-cli

                qoder --headless \
                  --message "检查并修复代码质量问题:
                    1. 运行 pnpm run format 修复 Prettier 格式问题
                    2. 运行 pnpm lint --fix 修复 ESLint 问题
                    3. 如果有修复:
                       git add -A
                       git commit -m 'fix: auto-fix lint issues by QoderCLI'
                       git push origin ${CI_MERGE_REQUEST_SOURCE_BRANCH}
                    4. 如果没有需要修复的问题，直接输出通过" \
                  --allowedTools "Bash,Read,Edit"
              timeout: 300
            envs:
              QODER_API_KEY: "${QODER_API_KEY}"
            continueOnError: true

  # ─── 阶段 4: 审查结果通知 ────────────────────────────────
  notify_stage:
    name: "审查结果通知"
    jobs:
      notify_job:
        name: "钉钉通知 MR 审查完成"
        needs: [autofix_job]
        runsOn:
          group: China Aliyun Linux 3
        steps:
          dingtalk_step:
            step: DingTalkNotice
            name: "通知开发者 Review 完成"
            with:
              webhook: "${DINGTALK_WEBHOOK}"
              msgtype: markdown
              title: "MR Code Review 完成"
              text: |
                ## 🔍 AI Code Review 完成

                **MR**: ${CI_MERGE_REQUEST_TITLE}
                **提交者**: ${CI_COMMIT_AUTHOR}
                **源分支**: ${CI_MERGE_REQUEST_SOURCE_BRANCH}
                **目标分支**: main

                审查报告已保存为流水线制品，请前往云效 Flow 查看详情。

                ---
                *由 QoderCLI + 云效 Flow 自动化审查*
